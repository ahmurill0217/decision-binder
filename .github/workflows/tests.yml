name: CPU synthetic tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      CUDA_VISIBLE_DEVICES: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.1'
      - run: uv sync --frozen --python 3.12 --extra dev --extra evaluation --extra training
      - run: uv run --frozen --extra dev --extra evaluation --extra training pytest -m 'not integration' -q
